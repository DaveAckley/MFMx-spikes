[build-system]
requires = ["scikit-build-core>=0.8.1", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mfmx"
version = "0.0.1"
description = "A C++/Python project with Card class"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["pybind11", "cmake", "scikit-build-core"]

[tool.scikit-build]
# This tells scikit-build-core where your top-level CMakeLists.txt is
cmake.source-dir = "."
build-dir = "_build_debug"
#wheel.packages = ["_build_debug/src"]
#wheel.install-dir = "mfmx"

